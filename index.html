<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鶯歌清運路線助手 Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 起終點與音樂標記 */
        .pin-s, .pin-e {
            width: 32px; height: 32px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
            border: 2.5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
        }
        .pin-s { background: #2563eb; }
        .pin-e { background: #1e40af; }
        .pin-s span, .pin-e span { transform: rotate(45deg); color: #fff; font-weight: 900; font-size: 14px; }
        
        .music-marker {
            padding: 3px 8px; border-radius: 999px; font-weight: 800; font-size: 12px;
            color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        .music-on-pin { background: #16a34a; }
        .music-off-pin { background: #dc2626; }

        /* 導航車頭箭頭 */
        .nav-puck {
            width: 36px; height: 36px; border-radius: 50%;
            background: #2563eb; border: 3px solid #ffffff;
            box-shadow: 0 3px 10px rgba(37,99,235,0.6);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px;
            transition: transform 0.1s ease-out; /* 讓轉向更平滑 */
        }

        /* 進度條拉桿 */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #ffffff; border: 4px solid #2563eb; cursor: pointer;
            margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: #e2e8f0; border-radius: 999px;
        }

        /* 導航方向指示大圖標動畫 */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .nav-alert-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>

<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</head>
<body class="bg-gray-900 relative">

    <div id="map"></div>

    <!-- 語音與視覺警報橫幅 (提前 30 公尺觸發音樂開關或轉彎) -->
    <div id="musicAlertBanner" class="hidden fixed top-20 left-4 right-4 z-50 rounded-2xl p-4 shadow-2xl text-white font-black text-center animate-bounce border-2 border-white pointer-events-auto flex items-center justify-center gap-3">
        <!-- 內容由 JS 動態填入 -->
    </div>

    <!-- OLED 黑屏省電模式 -->
    <div id="blackOverlay" class="hidden fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center text-gray-500 cursor-pointer pointer-events-auto transition-opacity duration-300">
        <i class="fa-solid fa-moon text-5xl mb-6 text-gray-700"></i>
        <p class="text-xl font-bold text-gray-400 tracking-wider">智慧省電模式</p>
        <p class="text-sm mt-4 text-gray-600">接近路口或音樂點將自動喚醒</p>
        <p class="text-xs mt-6 opacity-40 border border-gray-800 px-5 py-2 rounded-full">點擊螢幕任意處強制喚醒</p>
    </div>

    <!-- 偏離路線警告層 -->
    <div id="offRouteWarning" class="hidden fixed inset-0 bg-red-600/20 z-[9998] pointer-events-none flex items-center justify-center">
        <div class="bg-red-600 text-white px-6 py-3 rounded-full font-black text-lg shadow-2xl animate-pulse flex items-center gap-2 border-2 border-white">
            <i class="fa-solid fa-triangle-exclamation"></i> 已偏離原定路線
        </div>
    </div>

    <!-- 頂部導航狀態與工具列 -->
    <div class="absolute top-6 left-4 right-4 flex justify-between items-start ui-layer">
        <div class="flex items-center gap-2 pointer-events-auto">
            <!-- 加上 relative z-[99999] -->
<button id="topBackBtn" class="hidden bg-white w-11 h-11 rounded-2xl shadow-lg text-blue-600 flex items-center justify-center active:scale-95 relative z-[99999]">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>
            <div class="bg-white/95 backdrop-blur px-4 py-2.5 rounded-2xl shadow-lg text-gray-800 font-extrabold text-sm flex items-center gap-2">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                <span id="appStatusTitle">鶯歌清運路線助手 Pro Max</span>
            </div>
        </div>

        <!-- 右側浮動控制鍵 -->
        <div class="flex flex-col gap-2.5 pointer-events-auto">
            <button id="headingModeBtn" class="bg-blue-600 text-white w-11 h-11 rounded-2xl shadow-lg flex flex-col items-center justify-center active:scale-95" title="切換車頭朝上/正北朝上">
                <i id="headingIcon" class="fa-solid fa-compass text-base"></i>
                <span id="headingLabel" class="text-[9px] font-bold leading-none mt-0.5">車頭上</span>
            </button>
            <button id="locateBtn" class="bg-white text-blue-600 w-11 h-11 rounded-2xl shadow-lg flex flex-col items-center justify-center active:scale-95 border-2 border-blue-500" title="鎖定跟隨車輛">
                <i class="fa-solid fa-location-crosshairs text-base"></i>
                <span id="followLabel" class="text-[9px] font-bold leading-none mt-0.5">跟隨中</span>
            </button>
            <button id="blackScreenBtn" class="bg-gray-800 text-white w-11 h-11 rounded-2xl shadow-lg border border-gray-600 flex items-center justify-center active:scale-95">
                <i class="fa-solid fa-moon text-base"></i>
            </button>
            <button id="followStopBtn" class="hidden bg-red-600 text-white px-3 py-2.5 rounded-2xl shadow-lg font-bold text-xs flex items-center gap-1 active:scale-95">
                <i class="fa-solid fa-xmark"></i> 結束遵循
            </button>
        </div>
    </div>

    <!-- 1. 主介面底部控制面板 -->
    <div id="mainUI" class="absolute bottom-4 left-4 right-4 ui-layer flex justify-center">
        <div class="bg-white rounded-3xl p-4 shadow-2xl pointer-events-auto w-full max-w-md border border-gray-100">
            
            <!-- 待機時顯示：精度設定 & 已儲存路線 -->
            <div id="idleTopRow" class="flex justify-between items-center mb-3 gap-2.5">
                <div id="settingsBtn" class="bg-green-50 text-green-800 px-3.5 py-2.5 rounded-2xl flex-1 flex items-center justify-between border border-green-200 cursor-pointer active:scale-95">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-satellite-dish text-green-600"></i>
                        <div>
                            <div class="text-xs font-extrabold" id="currentModeText">高精度 (2秒)</div>
                            <div id="accuracyText" class="text-[11px] text-green-700">等待定位...</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-sliders text-xs opacity-50"></i>
                </div>
                <div id="historyBtn" class="bg-blue-50 text-blue-800 px-3.5 py-2.5 rounded-2xl flex-1 flex items-center justify-between border border-blue-200 cursor-pointer active:scale-95">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bookmark text-blue-600"></i>
                        <div>
                            <div class="text-xs font-extrabold">已儲存路線</div>
                            <div class="text-[11px] text-blue-600">複習 / 遵循</div>
                        </div>
                    </div>
                    <span id="historyCount" class="bg-blue-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                </div>
            </div>

            <!-- 紀錄中顯示：GPS精度小格 + 回收車音樂開關大按鈕 (不擋地圖中間！) -->
            <div id="recordingTopRow" class="hidden flex items-stretch gap-2.5 mb-3">
                <div class="bg-gray-100 px-3 py-2 rounded-2xl flex flex-col justify-center items-center w-24 flex-shrink-0">
                    <span class="text-[10px] text-gray-500 font-bold">GPS 精度</span>
                    <span id="recAccuracyText" class="text-xs font-extrabold text-gray-800 mt-0.5">± 5 m</span>
                </div>
                <button id="musicToggleBtn" class="flex-1 bg-gray-700 text-white font-extrabold py-3 px-4 rounded-2xl flex items-center justify-center gap-2 shadow-inner active:scale-95 transition-all">
                    <i id="musicBtnIcon" class="fa-solid fa-volume-xmark text-lg"></i>
                    <span id="musicBtnText" class="text-sm">音樂關閉中 (點擊開啟)</span>
                </button>
            </div>

            <button id="recordBtn" class="w-full bg-green-700 text-white font-extrabold py-3.5 rounded-2xl text-base flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-all">
                <i class="fa-solid fa-play"></i> <span id="recordBtnText">開始紀錄路線</span>
            </button>

            <div class="flex justify-between text-center mt-3.5 pt-2.5 border-t border-gray-100 px-1">
                <div class="flex-1">
                    <div class="text-gray-400 text-[11px] font-bold">距離</div>
                    <div class="font-black text-lg text-gray-800"><span id="distanceText">0.00</span> <span class="text-xs font-normal">km</span></div>
                </div>
                <div class="border-l border-gray-100"></div>
                <div class="flex-1">
                    <div class="text-gray-400 text-[11px] font-bold">期間</div>
                    <div id="timeText" class="font-black text-lg text-gray-800">00:00:00</div>
                </div>
                <div class="border-l border-gray-100"></div>
                <div class="flex-1">
                    <div class="text-gray-400 text-[11px] font-bold">時速</div>
                    <div class="font-black text-lg text-gray-800"><span id="speedText">0.0</span> <span class="text-xs font-normal">km/h</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 路線詳情預覽面板 -->
    <div id="routeDetailUI" class="hidden absolute bottom-4 left-4 right-4 ui-layer flex justify-center">
        <div class="bg-white rounded-3xl p-5 shadow-2xl pointer-events-auto w-full max-w-md">
            <div class="flex items-start justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-route"></i>
                    </div>
                    <div>
                        <h3 id="detailTitle" class="font-black text-gray-900 text-lg leading-tight">路線名稱</h3>
                        <p id="detailDate" class="text-xs text-gray-500 mt-0.5">保存於 日期</p>
                    </div>
                </div>
              <div class="flex gap-2">
                <button id="exportRouteBtn" class="text-blue-600 hover:text-blue-800 p-2 bg-blue-50 rounded-xl active:scale-95 relative z-[99999]"><i class="fa-solid fa-share-nodes"></i></button>
<button id="deleteRouteBtn" class="text-gray-400 hover:text-red-600 p-2 active:scale-95 relative z-[99999]"><i class="fa-regular fa-trash-can"></i></button>
            </div>
        </div>

            <div class="flex items-center gap-4 text-xs font-bold mb-3 px-1">
                <span class="flex items-center gap-1.5 text-green-700"><span class="w-3 h-1.5 bg-green-600 rounded-full inline-block"></span> 綠線：音樂收運</span>
                <span class="flex items-center gap-1.5 text-gray-500"><span class="w-3 h-1.5 bg-gray-400 rounded-full inline-block"></span> 灰虛線：音樂關閉</span>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-4">
                <div class="bg-gray-50 p-2.5 rounded-2xl text-center">
                    <div class="text-[11px] text-gray-400">距離</div>
                    <div id="detailDist" class="font-black text-sm text-gray-800 mt-0.5">0.00 km</div>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-2xl text-center">
                    <div class="text-[11px] text-gray-400">期間</div>
                    <div id="detailTime" class="font-black text-sm text-gray-800 mt-0.5">00m 00s</div>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-2xl text-center">
                    <div class="text-[11px] text-gray-400">音樂標記</div>
                    <div id="detailEvents" class="font-black text-sm text-blue-600 mt-0.5">0 處</div>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="startReplayBtn" class="flex-1 bg-blue-600 text-white font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-md active:scale-95">
                    <i class="fa-solid fa-play"></i> 重播複習
                </button>
                <button id="startFollowBtn" class="flex-1 bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-md active:scale-95 relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/20 w-full transform -skew-x-12 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    <i class="fa-solid fa-location-arrow"></i> 遵循導航
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 動態重播控制面板 -->
    <div id="playbackUI" class="hidden absolute bottom-4 left-4 right-4 ui-layer flex flex-col items-center gap-2.5">
        <div id="replayMusicBadge" class="bg-gray-800/90 backdrop-blur text-white text-xs font-extrabold px-4 py-1.5 rounded-full shadow-lg pointer-events-auto">
            🔇 目前路段：音樂關閉
        </div>

        <div class="bg-white rounded-full px-4 py-2 shadow-xl pointer-events-auto w-full max-w-md flex items-center gap-3 border border-gray-100">
            <button id="playPauseBtn" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-base shadow-md flex-shrink-0 active:scale-95">
                <i class="fa-solid fa-pause"></i>
            </button>
            <div class="flex-1 flex items-center py-2">
                <input id="playbackSlider" type="range" min="0" max="1000" value="0" step="1">
            </div>
            <button id="speedToggleBtn" class="text-xs font-black text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-full flex-shrink-0 active:scale-95">
                0.3x
            </button>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow-2xl pointer-events-auto w-full max-w-md flex items-center justify-between gap-3">
            <div class="min-w-0 flex-1">
                <div id="playbackTitle" class="font-black text-gray-900 text-base truncate">路線名稱</div>
                <div id="playbackSub" class="text-xs text-gray-500 truncate">雙指可自由旋轉縮放，按右上角恢復跟隨</div>
            </div>
            <button id="stopPlaybackBtn" class="bg-red-600 text-white font-extrabold px-5 py-3 rounded-2xl flex items-center gap-1.5 shadow-md active:scale-95 flex-shrink-0 text-sm">
                <i class="fa-solid fa-stop"></i> 停止
            </button>
        </div>
    </div>

    <!-- 精度設定彈窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 pointer-events-auto">
        <div class="bg-white w-11/12 max-w-sm rounded-3xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-black">紀錄精度設定</h2>
                <button id="closeSettings" class="text-gray-400 text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2.5">
                <label class="flex items-center justify-between p-3.5 border-2 border-blue-500 bg-blue-50 rounded-2xl cursor-pointer" onclick="setMode(2, 2, '高精度 (2秒)')">
                    <div><div class="font-extrabold text-sm">高精度 (清運巷弄推薦)</div><div class="text-xs text-gray-500">2 秒 · 2 m (轉彎細節最完整)</div></div>
                    <input type="radio" name="gpsMode" value="2" checked class="w-5 h-5">
                </label>
                <label class="flex items-center justify-between p-3.5 border rounded-2xl cursor-pointer" onclick="setMode(5, 6, '均衡 (5秒)')">
                    <div><div class="font-extrabold text-sm">均衡模式</div><div class="text-xs text-gray-500">5 秒 · 6 m (一般道路適用)</div></div>
                    <input type="radio" name="gpsMode" value="5" class="w-5 h-5">
                </label>
                <label class="flex items-center justify-between p-3.5 border rounded-2xl cursor-pointer" onclick="setMode(12, 20, '省電 (12秒)')">
                    <div><div class="font-extrabold text-sm">省電模式</div><div class="text-xs text-gray-500">12 秒 · 20 m (長途直線)</div></div>
                    <input type="radio" name="gpsMode" value="12" class="w-5 h-5">
                </label>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄清單彈窗 -->
    <div id="historyModal" class="hidden fixed inset-0 bg-gray-50 flex flex-col z-50 pointer-events-auto">
       <div class="bg-white p-4 flex items-center justify-between shadow-sm mt-6">
    <button id="closeHistory" class="w-10 h-10 rounded-xl bg-gray-100 text-blue-600 flex items-center justify-center active:scale-95 relative z-[99999]"><i class="fa-solid fa-house"></i></button>
    <h2 class="text-lg font-black text-gray-800">鶯歌清運路線庫</h2>
    <label class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center cursor-pointer shadow-sm active:scale-95" title="匯入路線">
        <i class="fa-solid fa-file-import"></i>
        <input type="file" id="importRouteInput" accept=".txt, .json, text/plain" class="hidden">
    </label>
</div>
        <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24"></div>
    </div>

    <script>
        // --- 1. 初始化 MapLibre GL 向量旋轉地圖 (免金鑰 Google Maps) ---
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'google-maps': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}'],
                        tileSize: 256,
                        attribution: '© Google'
                    }
                },
                layers: [{ id: 'google-maps-layer', type: 'raster', source: 'google-maps' }]
            },
            center: [121.346, 24.954], // 鶯歌區
            zoom: 16, bearing: 0, pitch: 0, dragRotate: true, touchZoomRotate: true
        });

        // 核心狀態變數
        let isFollowingCamera = true;
        let isHeadingUpMode = true; 
        let currentHeading = 0;
        let lastKnownLngLat = [121.346, 24.954];
        let isRecording = false, watchId = null, wakeLock = null;
        let musicActive = false;
        let routePoints = [], musicEvents = []; 
        let totalDistanceKm = 0, startTime = 0, elapsedSec = 0, timerInterval = null;
        let gpsFreqMs = 2000, minMoveMeters = 2, lastRecordTime = 0;

        let savedRoutes = JSON.parse(localStorage.getItem('yinggeCleanRoutes_v2')) || [];
        let selectedRouteIdx = -1;
        let domMarkers = []; 

        document.getElementById('historyCount').innerText = savedRoutes.length;

        // 導航箭頭
        const puckEl = document.createElement('div');
        puckEl.className = 'nav-puck';
        puckEl.innerHTML = '<i class="fa-solid fa-location-arrow" style="transform: rotate(-45deg);"></i>';
        const vehicleMarker = new maplibregl.Marker({ element: puckEl, rotationAlignment: 'map' })
            .setLngLat(lastKnownLngLat).addTo(map);

        map.on('load', () => {
            map.addSource('bg-route', { type: 'geojson', data: emptyGeoJSON() });
            map.addLayer({ id: 'bg-route-line', type: 'line', source: 'bg-route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#94a3b8', 'line-width': 6, 'line-opacity': 0.45 } });

            map.addSource('route-Silent', { type: 'geojson', data: emptyGeoJSON() });
            map.addLayer({ id: 'route-silent-line', type: 'line', source: 'route-Silent', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#3b82f6', 'line-width': 6, 'line-dasharray': [2, 2] } });

            map.addSource('route-music', { type: 'geojson', data: emptyGeoJSON() });
            map.addLayer({ id: 'route-music-line', type: 'line', source: 'route-music', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#16a34a', 'line-width': 7 } });

            navigator.geolocation?.getCurrentPosition(pos => {
                lastKnownLngLat = [pos.coords.longitude, pos.coords.latitude];
                vehicleMarker.setLngLat(lastKnownLngLat);
                map.jumpTo({ center: lastKnownLngLat, zoom: 17 });
                document.getElementById('accuracyText').innerText = `± ${Math.round(pos.coords.accuracy)} m`;
            }, () => {}, { enableHighAccuracy: true });
        });

        function emptyGeoJSON() { return { type: 'FeatureCollection', features: [] }; }

        // --- 2. 視角操作 ---
        ['dragstart', 'touchstart', 'wheel', 'rotatestart', 'pitchstart'].forEach(evt => {
            map.on(evt, (e) => { if (e.originalEvent) setCameraFollow(false); });
        });

        function setCameraFollow(follow) {
            isFollowingCamera = follow;
            const btn = document.getElementById('locateBtn');
            const label = document.getElementById('followLabel');
            if (follow) {
                btn.className = "bg-white text-blue-600 w-11 h-11 rounded-2xl shadow-lg flex flex-col items-center justify-center active:scale-95 border-2 border-blue-500";
                label.innerText = "跟隨中";
            } else {

        // --- 3. 幾何數學計算 ---
        function getDistanceKm(lng1, lat1, lng2, lat2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getBearing(lng1, lat1, lng2, lat2) {
            const toRad = d => d * Math.PI / 180;
            const toDeg = r => r * 180 / Math.PI;
            const dLon = toRad(lng2 - lng1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            return (toDeg(Math.atan2(y, x)) + 360) % 360;
        }

        // 兩角度的最小差值 (-180 到 180)
        function getAngleDiff(angle1, angle2) {
            let diff = (angle2 - angle1 + 180) % 360 - 180;
            return diff < -180 ? diff + 360 : diff;
        }

        // 點到線段的最短距離 (公尺) - 判斷偏離路線用
        function pointToLineDistanceMeters(ptLng, ptLat, lineStart, lineEnd) {
            const R = 6371000;
            const lat1 = lineStart.lat * Math.PI / 180, lon1 = lineStart.lng * Math.PI / 180;
            const lat2 = lineEnd.lat * Math.PI / 180, lon2 = lineEnd.lng * Math.PI / 180;
            const lat3 = ptLat * Math.PI / 180, lon3 = ptLng * Math.PI / 180;

            const d13 = Math.acos(Math.sin(lat1)*Math.sin(lat3) + Math.cos(lat1)*Math.cos(lat3)*Math.cos(lon3-lon1)) * R;
            const theta13 = Math.atan2(Math.sin(lon3-lon1)*Math.cos(lat3), Math.cos(lat1)*Math.sin(lat3)-Math.sin(lat1)*Math.cos(lat3)*Math.cos(lon3-lon1));
            const theta12 = Math.atan2(Math.sin(lon2-lon1)*Math.cos(lat2), Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(lon2-lon1));
            
            const crossTrackDist = Math.asin(Math.sin(d13/R) * Math.sin(theta13-theta12)) * R;
            return Math.abs(crossTrackDist);
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW';

            window.speechSynthesis.speak(u);

        function updateRouteLayers(points) {
            const musicFeatures = [], silentFeatures = [];

                if (curr.musicActive) musicFeatures.push(seg);
                else silentFeatures.push(seg);
            }
            map.getSource('route-music')?.setData({ type: 'FeatureCollection', features: musicFeatures });
            map.getSource('route-Silent')?.setData({ type: 'FeatureCollection', features: silentFeatures });
        }

        document.getElementById('recordBtn').onclick = async () => {
            if (!isRecording) {
                isRecording = true;
                musicActive = false;
                renderMusicButtonState();
                routePoints = []; musicEvents = []; totalDistanceKm = 0; elapsedSec = 0;
                clearDomMarkers();
                updateRouteLayers([]);
                map.getSource('bg-route')?.setData(emptyGeoJSON());
                startTime = Date.now();

                document.getElementById('idleTopRow').classList.add('hidden');

                document.getElementById('recordBtn').querySelector('i').classList.replace('fa-play', 'fa-stop');
                document.getElementById('appStatusTitle').innerText = '路線紀錄中...';
                setCameraFollow(true);

                try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}

                timerInterval = setInterval(() => {
                    elapsedSec = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('timeText').innerText = new Date(elapsedSec * 1000).toISOString().substr(11, 8);
                }, 1000);

                watchId = navigator.geolocation.watchPosition(pos => {
                    const now = Date.now();
                    const lng = pos.coords.longitude, lat = pos.coords.latitude;
                    const acc = Math.round(pos.coords.accuracy);
                    document.getElementById('recAccuracyText').innerText = `± ${acc} m`;
                    if (pos.coords.speed !== null) document.getElementById('speedText').innerText = (pos.coords.speed * 3.6).toFixed(1);

                    if (routePoints.length === 0) {

                        vehicleMarker.setLngLat([lng, lat]);
                        lastRecordTime = now;
                        return;
                    }

                    const prev = routePoints[routePoints.length - 1];
                    const distKm = getDistanceKm(prev.lng, prev.lat, lng, lat);
                    const distM = distKm * 1000;

                    if (distM >= minMoveMeters || (now - lastRecordTime >= gpsFreqMs && distM >= 1.5)) {
                        currentHeading = getBearing(prev.lng, prev.lat, lng, lat);
                        totalDistanceKm += distKm;
                        document.getElementById('distanceText').innerText = totalDistanceKm.toFixed(2);
                        
                        lastKnownLngLat = [lng, lat];
                        routePoints.push({ lng, lat, time: now, musicActive, bearing: currentHeading });
                        vehicleMarker.setLngLat([lng, lat]).setRotation(currentHeading);
                        updateRouteLayers(routePoints);

                        if (isFollowingCamera) {
                            map.easeTo({
                                center: [lng, lat],
                                bearing: isHeadingUpMode ? currentHeading : map.getBearing(),
                                offset: [0, -80], duration: 300
                            });
                        }
                        lastRecordTime = now;
                    }
                }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });

            } else {
                isRecording = false;
                if (watchId) navigator.geolocation.clearWatch(watchId);
                clearInterval(timerInterval);
                if (wakeLock) { wakeLock.release(); wakeLock = null; }

                document.getElementById('recordingTopRow').classList.add('hidden');
                document.getElementById('idleTopRow').classList.remove('hidden');
                document.getElementById('recordBtn').classList.replace('bg-red-600', 'bg-green-700');

                document.getElementById('recordBtn').querySelector('i').classList.replace('fa-stop', 'fa-play');
                document.getElementById('appStatusTitle').innerText = '鶯歌清運路線助手';

                if (routePoints.length >= 2) {
                    const defaultName = "鶯歌路線 " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const name = prompt("路線紀錄完成！請輸入路線名稱（如：尖山線第一趟）：", defaultName);
                    if (name) {
                        const savedAuthor = localStorage.getItem('yinggeRouteLastAuthor') || '凱哥';
                        const author = prompt("請輸入這條路線的創作者署名：", savedAuthor) || "熱心隊員";
                        localStorage.setItem('yinggeRouteLastAuthor', author);

                        const mins = Math.floor(elapsedSec / 60), secs = elapsedSec % 60;
                        savedRoutes.unshift({

                            distance: totalDistanceKm.toFixed(2),

                        localStorage.setItem('yinggeCleanRoutes_v2', JSON.stringify(savedRoutes));
                        document.getElementById('historyCount').innerText = savedRoutes.length;
                        openRouteDetail(0);

        // --- 6. 模擬重播引擎 ---
        let animFrameId = null, isPlaying = false, playProgress = 0, lastFrameTime = 0;
        const speedOptions = [0.3, 0.5, 1, 2, 4];
        let speedMultiplier = 0.3;

        const playbackSlider = document.getElementById('playbackSlider');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const speedToggleBtn = document.getElementById('speedToggleBtn');

        document.getElementById('startReplayBtn').onclick = () => {
            const route = savedRoutes[selectedRouteIdx];
            if (!route.points || route.points.length < 2) return;

            document.getElementById('routeDetailUI').classList.add('hidden');
            document.getElementById('playbackUI').classList.remove('hidden');
            document.getElementById('appStatusTitle').innerText = '路線重播複習';

            map.getSource('bg-route')?.setData({
                type: 'FeatureCollection',
                features: [{ type: 'Feature', geometry: { type: 'LineString', coordinates: route.points.map(p => [p.lng, p.lat]) } }]
            });
            updateRouteLayers([]);
            renderRouteMarkers(route);

            playProgress = 0; playbackSlider.max = (route.points.length - 1) * 100; playbackSlider.value = 0;
            setCameraFollow(true);

            const startPt = route.points[0];
            lastKnownLngLat = [startPt.lng, startPt.lat];
            vehicleMarker.setLngLat(lastKnownLngLat);

        function renderInterpolatedStep(floatIdx) {
            const route = savedRoutes[selectedRouteIdx];
            const pts = route.points;
            const maxIdx = pts.length - 1;
            const clamped = Math.min(Math.max(floatIdx, 0), maxIdx);
            const i = Math.floor(clamped);
            const frac = clamped - i;

            const p1 = pts[i], p2 = pts[Math.min(i + 1, maxIdx)];
            const curLng = p1.lng + (p2.lng - p1.lng) * frac;
            const curLat = p1.lat + (p2.lat - p1.lat) * frac;
            lastKnownLngLat = [curLng, curLat];

            if (i < maxIdx && (p1.lng !== p2.lng || p1.lat !== p2.lat)) currentHeading = getBearing(p1.lng, p1.lat, p2.lng, p2.lat);

            vehicleMarker.setLngLat(lastKnownLngLat).setRotation(currentHeading);

            const walkedPoints = pts.slice(0, i + 1).concat([{ lng: curLng, lat: curLat, musicActive: p2.musicActive }]);
            updateRouteLayers(walkedPoints);

            const badge = document.getElementById('replayMusicBadge');
            if (p2.musicActive) {
                badge.className = "bg-green-600 text-white text-xs font-extrabold px-4 py-1.5 rounded-full shadow-lg pointer-events-auto";
                badge.innerText = "🎵 目前路段：播放回收音樂中";
            } else {
                badge.className = "bg-gray-800/90 text-white text-xs font-extrabold px-4 py-1.5 rounded-full shadow-lg pointer-events-auto";
                badge.innerText = "🔇 目前路段：音樂已關閉 (中斷移動)";
            }

            if (isFollowingCamera) map.jumpTo({ center: lastKnownLngLat, bearing: isHeadingUpMode ? currentHeading : map.getBearing(), offset: [0, -80] });
        }

        function playbackLoop(timestamp) {
            if (!isPlaying) return;
            if (!lastFrameTime) lastFrameTime = timestamp;
            const deltaSec = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;

            const maxIdx = savedRoutes[selectedRouteIdx].points.length - 1;
            playProgress += deltaSec * 2.5 * speedMultiplier;

            if (playProgress >= maxIdx) {
                playProgress = maxIdx;
                renderInterpolatedStep(playProgress);
                playbackSlider.value = Math.round(playProgress * 100);
                stopSmoothPlayback();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                return;
            }

            renderInterpolatedStep(playProgress);
            playbackSlider.value = Math.round(playProgress * 100);
            animFrameId = requestAnimationFrame(playbackLoop);
        }

        function startSmoothPlayback() {
            if (playProgress >= savedRoutes[selectedRouteIdx].points.length - 1) playProgress = 0;
            isPlaying = true; lastFrameTime = 0;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            animFrameId = requestAnimationFrame(playbackLoop);
        }

        function stopSmoothPlayback() {
            isPlaying = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

        playPauseBtn.onclick = () => isPlaying ? stopSmoothPlayback() : startSmoothPlayback();
        playbackSlider.oninput = (e) => { playProgress = parseInt(e.target.value, 10) / 100; renderInterpolatedStep(playProgress); };
        speedToggleBtn.onclick = () => {
            const nextIdx = (speedOptions.indexOf(speedMultiplier) + 1) % speedOptions.length;
            speedMultiplier = speedOptions[nextIdx];
            speedToggleBtn.innerText = `${speedMultiplier}x`;
        };
        document.getElementById('stopPlaybackBtn').onclick = () => { stopSmoothPlayback(); openRouteDetail(selectedRouteIdx); };

        // --- 7. 🔥 Pro Max 級實戰導航引擎 (嚴格判定 + 轉彎提示 + 智慧黑屏 + 偏離警告) ---
        let triggeredMusicIndices = new Set();
        let triggeredTurnIndices = new Set();
        let isBlackScreenActive = false; // 紀錄使用者是否手動啟用了黑屏
        let isScreenAutoWoken = false;   // 紀錄目前是否被系統暫時喚醒
        let sleepTimer = null;           // 重新進入黑屏的計時器

        const blackOverlay = document.getElementById('blackOverlay');
        const offRouteWarning = document.getElementById('offRouteWarning');
        const banner = document.getElementById('musicAlertBanner');

        // 黑屏按鈕手動控制
        document.getElementById('blackScreenBtn').onclick = () => {
            isBlackScreenActive = true;
            isScreenAutoWoken = false;
            blackOverlay.classList.remove('hidden');
        };
        // 點擊螢幕任何地方強制離開黑屏
        blackOverlay.onclick = () => {
            isBlackScreenActive = false;

            if (sleepTimer) clearTimeout(sleepTimer);
            blackOverlay.classList.add('hidden');

        // 智慧喚醒函數
        function autoWakeScreen() {
            if (!isBlackScreenActive) return; // 如果本來就沒開黑屏，不用動作
            if (isScreenAutoWoken) return;    // 已經被喚醒過了
            
            isScreenAutoWoken = true;
            blackOverlay.classList.add('opacity-0'); // 淡出黑屏
            setTimeout(() => { 
                if(isScreenAutoWoken) blackOverlay.classList.add('hidden'); 
            }, 300);
            
            vibrate([100, 50, 100]); // 震動提示喚醒
        }

        // 任務完成後，重新進入黑屏
        function autoSleepScreen() {
            if (!isBlackScreenActive) return; // 使用者沒說要黑屏
            if (sleepTimer) clearTimeout(sleepTimer);
            
            // 延遲 5 秒後重新黑屏
            sleepTimer = setTimeout(() => {
                if (isBlackScreenActive) {
                    isScreenAutoWoken = false;
                    blackOverlay.classList.remove('hidden');
                    // 一小段延遲讓 CSS 動畫生效
                    setTimeout(() => blackOverlay.classList.remove('opacity-0'), 10);
                }
            }, 5000);
        }

        // 顯示頂部大字報警告
        function showNavAlert(iconHtml, text, bgColorClass) {
            banner.className = `fixed top-16 left-4 right-4 z-50 rounded-2xl p-4 shadow-2xl text-white font-black text-center text-2xl nav-alert-pop border-4 border-white pointer-events-auto flex items-center justify-center gap-3 ${bgColorClass}`;
            banner.innerHTML = `<span class="text-4xl drop-shadow-md">${iconHtml}</span> <span>${text}</span>`;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 6000);
        }

        document.getElementById('startFollowBtn').onclick = async () => {
            const route = savedRoutes[selectedRouteIdx];
            document.getElementById('routeDetailUI').classList.add('hidden');
            document.getElementById('followStopBtn').classList.remove('hidden');
            document.getElementById('appStatusTitle').innerText = `導航：${route.name}`;
            
            triggeredMusicIndices.clear();
            triggeredTurnIndices.clear();
            isBlackScreenActive = false;
            isScreenAutoWoken = false;
            
            updateRouteLayers(route.points);
            renderRouteMarkers(route);
            setCameraFollow(true);

            // 請求螢幕常亮
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}

            followWatchId = navigator.geolocation.watchPosition(pos => {
                const lng = pos.coords.longitude, lat = pos.coords.latitude;
                // 如果手機有硬體羅盤 heading，優先使用
                if (pos.coords.heading !== null && pos.coords.heading !== NaN) {
                    currentHeading = pos.coords.heading;
                } else if (lastKnownLngLat[0] !== lng || lastKnownLngLat[1] !== lat) {
                    // 否則用 GPS 位移計算前進方向 (速度 > 1m/s 才算準確)
                    if (pos.coords.speed > 1) currentHeading = getBearing(lastKnownLngLat[0], lastKnownLngLat[1], lng, lat);
                }
                
                lastKnownLngLat = [lng, lat];
                vehicleMarker.setLngLat(lastKnownLngLat).setRotation(currentHeading);

                if (isFollowingCamera) {
                    map.easeTo({
                        center: lastKnownLngLat,
                        bearing: isHeadingUpMode ? currentHeading : map.getBearing(),
                        offset: [0, -80], duration: 300
                    });
                }

                // 核心導航邏輯檢查
                const pts = route.points;
                let isOffRoute = true;
                let closestPtIdx = 0;
                let minDist = Infinity;

                // 1. 尋找距離最近的軌跡線段，判斷是否偏離路線
                for (let i = 0; i < pts.length - 1; i++) {
                    const distToSeg = pointToLineDistanceMeters(lng, lat, pts[i], pts[i+1]);
                    if (distToSeg < minDist) {
                        minDist = distToSeg;
                        closestPtIdx = i;
                    }
                }

                // 寬容度 25 公尺內都算在路線上
                if (minDist < 25) {
                    isOffRoute = false;
                    offRouteWarning.classList.add('hidden');
                } else {
                    offRouteWarning.classList.remove('hidden');
                    // 每 10 秒提示一次偏離
                    if (Math.floor(Date.now() / 1000) % 10 === 0) {
                        speakText("已偏離路線");
                        vibrate([200, 100, 200]);
                        autoWakeScreen();
                    }
                }

                if (!isOffRoute) {
                    // 2. 轉彎語音導航檢查 (檢查前方 3 到 6 個紀錄點的軌跡角度變化)
                    // 假設一秒記錄一個點，大約檢查前方 15~30 公尺的轉彎
                    const lookAheadIdx = Math.min(closestPtIdx + 4, pts.length - 1);
                    if (lookAheadIdx > closestPtIdx && !triggeredTurnIndices.has(closestPtIdx)) {
                        const currentSegAngle = getBearing(pts[closestPtIdx].lng, pts[closestPtIdx].lat, pts[closestPtIdx+1].lng, pts[closestPtIdx+1].lat);
                        const futureSegAngle = getBearing(pts[lookAheadIdx-1].lng, pts[lookAheadIdx-1].lat, pts[lookAheadIdx].lng, pts[lookAheadIdx].lat);
                        
                        const angleDiff = getAngleDiff(currentSegAngle, futureSegAngle);
                        
                        if (angleDiff > 45 && angleDiff < 135) {
                            triggeredTurnIndices.add(closestPtIdx); // 避免重複報
                            autoWakeScreen();
                            showNavAlert('➡️', '前方準備右轉', 'bg-blue-600');
                            speakText("前方準備右轉");
                            autoSleepScreen();
                        } else if (angleDiff < -45 && angleDiff > -135) {
                            triggeredTurnIndices.add(closestPtIdx);
                            autoWakeScreen();
                            showNavAlert('⬅️', '前方準備左轉', 'bg-blue-600');
                            speakText("前方準備左轉");
                            autoSleepScreen();
                        }
                    }

                    // 3. 嚴格音樂標記判定 (加入車頭方向限制，解決平行巷弄誤判)
                    (route.events || []).forEach((ev, idx) => {
                        if (triggeredMusicIndices.has(idx)) return;
                        const distMeters = getDistanceKm(lng, lat, ev.lng, ev.lat) * 1000;
                        
                        // 距離 35 米內，且「車頭方向」與「當初記錄標記時的車頭方向」誤差小於 60 度
                        if (distMeters <= 35) {
                            const headingDiff = Math.abs(getAngleDiff(currentHeading, ev.bearing || currentHeading));
                            if (headingDiff < 60 || !ev.bearing) { // 如果是舊資料沒有 bearing 就跳過角度檢查
                                triggeredMusicIndices.add(idx);
                                autoWakeScreen();
                                
                                if (ev.type === 'on') {
                                    showNavAlert('🎵', '開啟回收音樂！', 'bg-green-600');
                                    speakText("前方準備開啟回收音樂");
                                } else {
                                    showNavAlert('🔇', '關閉回收音樂！', 'bg-red-600');
                                    speakText("前方準備關閉回收音樂");
                                }
                                autoSleepScreen();
                            }
                        }
                    });
                }
            }, () => {}, { enableHighAccuracy: true, maximumAge: 0 });
        };

       // --- 8. 路線分享與匯入功能 (實體文字檔 .txt 版) ---
        document.getElementById('exportRouteBtn').onclick = async () => {
            const route = savedRoutes[selectedRouteIdx];
            const routeData = JSON.stringify(route);
            const blob = new Blob([routeData], { type: 'text/plain' });
            const file = new File([blob], `${route.name}.txt`, { type: 'text/plain' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: '分享清運路線', files: [file] });
                    return; 
                } catch (err) { console.log('分享取消，改下載'); }
            }
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${route.name}.txt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert(`✅ 已下載檔案：${route.name}.txt\n請到手機的「下載」資料夾，以傳送檔案的方式發到 LINE 群組。`);
        };

        document.getElementById('importRouteInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const route = JSON.parse(event.target.result);
                    if (!route.points || !route.name) throw new Error("格式不對");
                    
                    route.id = Date.now(); 
                    savedRoutes.unshift(route);
                    localStorage.setItem('yinggeCleanRoutes_v2', JSON.stringify(savedRoutes));
                    document.getElementById('historyCount').innerText = savedRoutes.length;
                    renderHistoryList();
                    alert(`✅ 成功匯入【${route.author || '熱心隊員'}】精心製作的路線：${route.name}`);
                } catch (err) {
                    alert('❌ 匯入失敗！請確認您選擇的是正確的路線檔案 (.txt)。');
                }
                e.target.value = ''; 
            };
            reader.readAsText(file);
        };

        // --- 精度設定控制 (補回並放在正確的獨立位置) ---
        document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
        document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
        window.setMode = function(sec, meters, text) {
            gpsFreqMs = sec * 1000; minMoveMeters = meters;
            document.getElementById('currentModeText').innerText = text;
            document.getElementById('settingsModal').classList.add('hidden');
        };
    </script>
</body>
</html>
